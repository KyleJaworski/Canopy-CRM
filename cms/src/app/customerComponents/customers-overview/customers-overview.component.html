<div>
  <h2 class="text-base font-semibold text-gray-900">Customer Todos</h2>
  <div class="lg:grid lg:grid-cols-12 lg:gap-x-16">
    <!--Calender-->
    <div
      class="mt-10 text-center lg:col-start-6 lg:col-end-13 lg:row-start-1 lg:mt-9 xl:col-start-7"
    >
      <div class="flex items-center text-gray-900">
        <button
          type="button"
          (click)="monthDown()"
          class="-m-1.5 flex flex-none items-center justify-center p-1.5 text-gray-400 hover:text-gray-500"
        >
          <span class="sr-only">Previous month</span>
          <svg
            class="size-5"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
            data-slot="icon"
          >
            <path
              fill-rule="evenodd"
              d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
        <div class="flex-auto text-sm font-semibold">
          {{ monthNames[selectedMonth] }} - {{ selectedYear }}
        </div>
        <button
          type="button"
          (click)="monthUp()"
          class="-m-1.5 flex flex-none items-center justify-center p-1.5 text-gray-400 hover:text-gray-500"
        >
          <span class="sr-only">Next month</span>
          <svg
            class="size-5"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
            data-slot="icon"
          >
            <path
              fill-rule="evenodd"
              d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
      <!--Day of Week-->
      <div class="mt-6 grid grid-cols-7 text-xs/6 text-gray-500">
        <div>M</div>
        <div>T</div>
        <div>W</div>
        <div>T</div>
        <div>F</div>
        <div>S</div>
        <div>S</div>
      </div>
      <div
        class="isolate mt-2 grid grid-cols-7 gap-px rounded-lg bg-gray-200 text-sm shadow ring-1 ring-gray-200"
      >
        <!--Calendar Date-->
        <button
          *ngFor="let day of calendarDays; let i = index"
          (click)="setSelectedDate(day)"
          [ngClass]="{
            'bg-white text-gray-900 font-semibold': isSelectedMonth(day.month),
            'bg-gray-50 text-gray-400': !isSelectedMonth(day.month),
            'text-indigo-600 font-extraboldbold': today === day.date,
            'text-white': selectedDate === day.date,
            'rounded-tl-lg' : i === 0,
            'rounded-tr-lg' : i === 6,
            'rounded-bl-lg' : (calendarDays.length ===  35 && i === 28) || (calendarDays.length ===  42 && i === 35),
            'rounded-br-lg' : (calendarDays.length === 35 && i === 34) || (calendarDays.length === 42 && i === 41),
          }"
          [ngClass]=""
          type="button"
          class="py-1.5 hover:bg-gray-100 focus:z-10 relative"
        >
          <time
            [attr.datetime]="day.date"
            [ngClass]="{
              'bg-gray-900': selectedDate === day.date,
              'bg-indigo-600': selectedDate === day.date && today === day.date,
            }"
            class="mx-auto flex size-7 items-center justify-center rounded-full"
            >{{ day.dayOfMonth }}</time
          >
          <span
            *ngIf="isScheduled(day.date)"
            class="absolute top-1 right-1 h-1 w-1 rounded-full bg-red-500"
          ></span>
        </button>
      </div>
      <button
        type="button"
        class="mt-8 w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      >
        Add event
      </button>
    </div>
    <!--Customer Meetings-->
    <!--<
    <div
      *ngIf="meetingsInSelectedMonth.length === 0; elseBlock"
      class="mt-4 flex flex-col items-center justify-center text-sm/6 lg:col-span-5 xl:col-span-6"
    >
      <div
        class="divide-y divide-gray-200 overflow-hidden rounded-lg bg-white shadow w-full max-w-md"
      >
        div class="px-4 py-5 sm:p-6 text-center">
          There is nothing scheduled for the selected date.
        </div>
        <div class="px-4 py-4 sm:px-6 flex justify-center">
          <img
            src="assets/images/calendar.png"
            alt="Appointment Icon"
            class="block"
            style="width: 100px; height: 100px"
          />
        </div>
      </div>
    </div>
-->
    <ol
      #elseBlock
      class="mt-4 divide-y divide-gray-100 text-sm/6 lg:col-span-5 xl:col-span-6"
    >
      <ng-container
        *ngFor="let meeting of meetingsInSelectedMonth; let i = index"
      >
        <li
          class="relative flex gap-x-6 py-6 xl:static hover:bg-gray-50"
          *ngIf="meeting.date === selectedDate"
        >
          <!-- Date and Location line-->
          <div class="flex-auto">
            <h3 class="pr-10 font-semibold text-gray-900 xl:pr-0">
              {{ meeting.customer.firstName }} {{ meeting.customer.lastName }}
            </h3>
            <dl class="mt-2 flex flex-col text-gray-500 xl:flex-row">
              <!--Date-->
              <div class="flex items-start gap-x-3">
                <dt class="mt-0.5">
                  <span class="sr-only">Date</span>
                  <svg
                    class="size-5 text-gray-400"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    aria-hidden="true"
                    data-slot="icon"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M5.75 2a.75.75 0 0 1 .75.75V4h7V2.75a.75.75 0 0 1 1.5 0V4h.25A2.75 2.75 0 0 1 18 6.75v8.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25v-8.5A2.75 2.75 0 0 1 4.75 4H5V2.75A.75.75 0 0 1 5.75 2Zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75Z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </dt>
                <dd>
                  <time datetime="2022-01-10T17:00">{{
                    meeting.displayDate
                  }}</time>
                </dd>
              </div>
              <!--Location-->
              <div
                class="mt-2 flex items-start gap-x-3 xl:ml-3.5 xl:mt-0 xl:border-l xl:border-gray-400/50 xl:pl-3.5"
              >
                <dt class="mt-0.5">
                  <span class="sr-only">Location</span>
                  <svg
                    class="size-5 text-gray-400"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    aria-hidden="true"
                    data-slot="icon"
                  >
                    <path
                      fill-rule="evenodd"
                      d="m9.69 18.933.003.001C9.89 19.02 10 19 10 19s.11.02.308-.066l.002-.001.006-.003.018-.008a5.741 5.741 0 0 0 .281-.14c.186-.096.446-.24.757-.433.62-.384 1.445-.966 2.274-1.765C15.302 14.988 17 12.493 17 9A7 7 0 1 0 3 9c0 3.492 1.698 5.988 3.355 7.584a13.731 13.731 0 0 0 2.273 1.765 11.842 11.842 0 0 0 .976.544l.062.029.018.008.006.003ZM10 11.25a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5Z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </dt>
                <dd>{{ meeting.location }}</dd>
              </div>
            </dl>
          </div>
          <!--Options-->
          <div
            class="absolute right-0 top-6 xl:relative xl:right-auto xl:top-auto xl:self-center"
          >
            <div>
              <button
                type="button"
                class="-m-2 flex items-center rounded-full p-2 text-gray-500 hover:text-gray-600"
                id="menu-0-button"
                [attr.aria-expanded]="openDropdownIndex === i"
                (click)="toggleDropdown(i)"
                aria-haspopup="true"
              >
                <span class="sr-only">Open options</span>
                <svg
                  class="size-5"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  aria-hidden="true"
                  data-slot="icon"
                >
                  <path
                    d="M3 10a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM8.5 10a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM15.5 8.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"
                  />
                </svg>
              </button>
            </div>

            <!--
              Dropdown menu, show/hide based on menu state.
  
              Entering: "transition ease-out duration-100"
                From: "transform opacity-0 scale-95"
                To: "transform opacity-100 scale-100"
              Leaving: "transition ease-in duration-75"
                From: "transform opacity-100 scale-100"
                To: "transform opacity-0 scale-95"
            -->
            <div
              class="absolute right-0 z-10 mt-2 w-36 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black/5 focus:outline-none"
              role="menu"
              aria-orientation="vertical"
              [class.hidden]="openDropdownIndex !== i"
              tabindex="-1"
            >
              <div class="py-1" role="none">
                <!-- Active: "bg-gray-100 text-gray-900 outline-none", Not Active: "text-gray-700" -->
                <a
                  href="#"
                  class="hover:bg-gray-100 block px-4 py-2 text-sm text-gray-700"
                  role="menuitem"
                  tabindex="-1"
                  id="menu-0-item-0"
                  >Edit</a
                >
                <a
                  href="#"
                  class="hover:bg-gray-100 block px-4 py-2 text-sm text-gray-700"
                  role="menuitem"
                  tabindex="-1"
                  id="menu-0-item-1"
                  >Cancel</a
                >
              </div>
            </div>
          </div>
        </li>
      </ng-container>
    </ol>
  </div>
</div>
