<ul role="list" class="divide-y divide-gray-100">
  <li
    *ngFor="let listItem of listItems"
    class="relative py-5 hover:bg-gray-50"
    [ngClass]="{
      'bg-gray-200 hover:bg-gray-200': listItem.isSelected
    }"
    (click)="onSelectItem(listItem)"
  >
    <div class="px-4 sm:px-6 lg:px-8">
      <div class="mx-auto flex max-w-4xl justify-between gap-x-6">
        <div class="flex min-w-0 gap-x-4">
          <div class="min-w-0 flex-auto">
            <p
              class="text-sm/6 font-semibold text-gray-900 flex items-center space-x-2"
            >
              <a href="#">
                <span class="absolute inset-x-0 -top-px bottom-0"></span>
                {{ listItem.fullName }}
              </a>
              <span
                *ngIf="!listItem.isActive"
                class="h-2 w-2 rounded-full bg-red-500"
                title="This item is inactive"
              ></span>
            </p>
            <p class="mt-1 flex text-xs/5 text-gray-500">
              <a
                href="mailto:{{ listItem.email }}"
                class="relative truncate hover:underline"
                >{{ listItem.email }}</a
              >
            </p>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-x-4">
          <div class="hidden sm:flex sm:flex-col sm:items-end">
            <p class="text-sm/6 text-gray-900">
              {{ listItem.additionalLabel }}
            </p>
          </div>
          <svg
            class="size-5 flex-none text-gray-400"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
            data-slot="icon"
          >
            <path
              fill-rule="evenodd"
              d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
      </div>
    </div>
  </li>
</ul>
