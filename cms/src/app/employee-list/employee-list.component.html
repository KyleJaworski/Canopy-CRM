<div class="flex justify-end">
  <button
    (click)="onAddEmployee()"
    type="button"
    class="rounded-full bg-indigo-600 px-3 mb-3 mr-3 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
  >
    Add new Employee
  </button>
</div>
<ul role="list" class="divide-y divide-gray-100">
  <li
    *ngFor="let employee of employees"
    class="relative py-5 hover:bg-gray-50"
    [ngClass]="selectedEmployeeId === employee.id ? 'bg-gray-100' : ''"
    (click)="onSelectEmployee(employee)"
  >
    <div class="px-4 sm:px-6 lg:px-8">
      <div class="mx-auto flex max-w-4xl justify-between gap-x-6">
        <div class="flex min-w-0 gap-x-4">
          <div class="min-w-0 flex-auto">
            <p class="text-sm/6 font-semibold text-gray-900">
              <a href="#">
                <span class="absolute inset-x-0 -top-px bottom-0"></span>
                {{ employee.firstName }} {{ employee.lastName }}
              </a>
            </p>
            <p class="mt-1 flex text-xs/5 text-gray-500">
              <a
                href="mailto:{{ employee.email }}"
                class="relative truncate hover:underline"
                >{{ employee.email }}</a
              >
            </p>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-x-4">
          <div class="hidden sm:flex sm:flex-col sm:items-end">
            <p class="text-sm/6 text-gray-900">{{ employee.jobTitle }}</p>
          </div>
          <svg
            class="size-5 flex-none text-gray-400"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
            data-slot="icon"
          >
            <path
              fill-rule="evenodd"
              d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
      </div>
    </div>
  </li>
</ul>
