<div
  class="-mt-1 grid grid-cols-1 gap-6 sm:mt-16 lg:grid-cols-4 mb-8 h-[calc(100vh-11rem)] overflow-hidden"
>
  <!-- Employee List Container -->
  <div
    class="p-px lg:col-span-1 lg:row-span-full rounded-lg bg-white py-4 shadow-lg mb-4"
  >
    <app-employee-list
      (selectedEmployee)="onSelectedEmployeeRecieved($event)"
      [employees]="employees"
    ></app-employee-list>
  </div>

  <!-- Employee Info Container -->
  <div
    class="p-px lg:col-span-3 lg:row-span-full rounded-lg bg-white px-7 py-4 shadow-lg sm:px-6 pb-4 mb-4 overflow-auto"
  >
    <app-tab-bar
      [tabItems]="tabItems"
      (selectedTab)="handleTabSelection($event)"
    ></app-tab-bar>
    <app-employee-info
      *ngIf="currentTab === 'Contact Information'"
      [employee]="selectedEmployee"
    ></app-employee-info>
  </div>
</div>
